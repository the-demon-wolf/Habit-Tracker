name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: |
          flutter create app --platforms=android --project-name habit_tracker
          rm -rf app/lib/*
          cp -r lib/* app/lib/
          mkdir -p app/android/app/src/main/res/layout app/android/app/src/main/res/xml app/android/app/src/main/res/drawable
          mkdir -p app/android/app/src/main/kotlin/com/example/habit_tracker
          cp -r android_widget/res/* app/android/app/src/main/res/
          cp android_widget/HabitWidgetProvider.kt app/android/app/src/main/kotlin/com/example/habit_tracker/
          python3 -c '
          import re
          p = "app/android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          ns = re.search(r"xmlns:android=\"[^\"]+\"", s).group(0)
          files = [
              "app/android/app/src/main/res/layout/habit_widget.xml",
              "app/android/app/src/main/res/xml/habit_widget_info.xml",
              "app/android/app/src/main/res/drawable/widget_bg.xml",
          ]
          for f in files:
              txt = open(f).read()
              open(f, "w").write(re.sub(r"xmlns:android=\"[^\"]*\"", ns, txt))
          s = re.sub(r"android:label=\"[^\"]+\"", "android:label=\"Habit Tracker\"", s)
          r = """<receiver android:name=".HabitWidgetProvider" android:label="Habit Tracker" android:exported="true"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/habit_widget_info" /></receiver></application>"""
          open(p, "w").write(s.replace("</application>", r))
          '
          cd app
          flutter pub add sqflite path home_widget
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: habit-tracker-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
