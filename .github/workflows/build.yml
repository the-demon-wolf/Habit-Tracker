name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: |
          flutter create app --platforms=android --project-name glass_habit_tracker
          rm -rf app/lib/*
          cp -r lib/* app/lib/
          mkdir -p app/android/app/src/main/res/layout app/android/app/src/main/res/xml app/android/app/src/main/res/drawable
          mkdir -p app/android/app/src/main/kotlin/com/example/glass_habit_tracker
          cp -r android_widget/res/* app/android/app/src/main/res/
          cp android_widget/HabitWidgetProvider.kt app/android/app/src/main/kotlin/com/example/glass_habit_tracker/
          cp android_widget/AndroidManifest.xml app/android/app/src/main/AndroidManifest.xml
          cd app
          flutter pub add sqflite path home_widget
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: habit-tracker-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
