name: Build Android APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: |
          flutter create app --platforms=android --project-name habit_tracker
          rm -rf app/lib/*
          cp -r lib/* app/lib/
          mkdir -p app/android/app/src/main/res/layout app/android/app/src/main/res/xml app/android/app/src/main/res/drawable
          mkdir -p app/android/app/src/main/kotlin/com/example/habit_tracker
          cp -r android_widget/res/* app/android/app/src/main/res/
          cp android_widget/*.kt app/android/app/src/main/kotlin/com/example/habit_tracker/
          python3 -c '
          import re
          p = "app/android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          ns = re.search(r"xmlns:android=\"[^\"]+\"", s).group(0)
          files = [
              "app/android/app/src/main/res/layout/habit_widget.xml",
              "app/android/app/src/main/res/xml/habit_widget_info.xml",
              "app/android/app/src/main/res/xml/shortcuts.xml",
              "app/android/app/src/main/res/drawable/widget_bg.xml",
              "app/android/app/src/main/res/drawable/ring_track.xml",
              "app/android/app/src/main/res/drawable/ring_progress.xml",
          ]
          for f in files:
              txt = open(f).read()
              open(f, "w").write(re.sub(r"xmlns:android=\"[^\"]*\"", ns, txt))
          perms = """<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>"""
          s = s.replace("<application", perms + "<application")
          s = re.sub(r"android:label=\"[^\"]+\"", "android:label=\"Habit Tracker\"", s)
          sc = """<meta-data android:name="android.app.shortcuts" android:resource="@xml/shortcuts" /></activity>"""
          s = s.replace("</activity>", sc)
          comp = """<receiver android:name="com.example.habit_tracker.HabitWidgetProvider" android:label="Habit Tracker" android:exported="true"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /><action android:name="com.example.habit_tracker.TOGGLE_HABIT" /></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/habit_widget_info" /></receiver><receiver android:name="com.example.habit_tracker.HabitToggleReceiver" android:exported="false" /><service android:name="com.example.habit_tracker.TodayTileService" android:label="Habit Tracker" android:icon="@mipmap/ic_launcher" android:permission="android.permission.BIND_QUICK_SETTINGS_TILE" android:exported="true"><intent-filter><action android:name="android.service.quicksettings.action.QS_TILE" /></intent-filter></service></application>"""
          open(p, "w").write(s.replace("</application>", comp))
          '
          cd app
          flutter pub add sqflite path home_widget share_plus file_picker path_provider shared_preferences flutter_local_notifications timezone
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: habit-tracker-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
