name: Build Android APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: |
          flutter create app --platforms=android --project-name habit_tracker
          rm -rf app/lib/*
          cp -r lib/* app/lib/
          mkdir -p app/android/app/src/main/res/layout app/android/app/src/main/res/xml app/android/app/src/main/res/drawable app/android/app/src/main/res/values
          mkdir -p app/android/app/src/main/kotlin/com/example/habit_tracker
          cp -r android_widget/res/* app/android/app/src/main/res/
          cp android_widget/*.kt app/android/app/src/main/kotlin/com/example/habit_tracker/
          python3 -c '
          import glob, re, os
          p = "app/android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          ns = re.search(r"xmlns:android=\"[^\"]+\"", s).group(0)
          for f in glob.glob("app/android/app/src/main/res/*/*.xml"):
              txt = open(f).read()
              open(f, "w").write(re.sub(r"xmlns:android=\"[^\"]*\"", ns, txt))
          s = re.sub(r"android:label=\"[^\"]+\"", "android:label=\"Habit Tracker\"", s)
          perms = """<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/><application"""
          s = s.replace("<application", perms, 1)
          shortcut_meta = """<meta-data android:name="android.app.shortcuts" android:resource="@xml/shortcuts"/></activity>"""
          s = s.replace("</activity>", shortcut_meta, 1)
          comps = """<receiver android:name="com.example.habit_tracker.HabitWidgetProvider" android:label="Habit Tracker" android:exported="true"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/habit_widget_info"/></receiver><receiver android:name="com.example.habit_tracker.HabitToggleReceiver" android:exported="false"/><service android:name="com.example.habit_tracker.HabitTileService" android:label="Habit Tracker" android:icon="@mipmap/ic_launcher" android:permission="android.permission.BIND_QUICK_SETTINGS_TILE" android:exported="true"><intent-filter><action android:name="android.service.quicksettings.action.QS_TILE"/></intent-filter></service><receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"/><receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/><action android:name="android.intent.action.MY_PACKAGE_REPLACED"/></intent-filter></receiver></application>"""
          open(p, "w").write(s.replace("</application>", comps))
          bg = "app/android/app/build.gradle.kts"
          if os.path.exists(bg):
              btxt = open(bg).read()
              btxt = re.sub(r"compileSdk\s*=\s*\S+", "compileSdk = 37", btxt)
              btxt = btxt.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true")
              btxt += "\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")\n}\n"
              open(bg, "w").write(btxt)
          '
          cd app
          flutter pub add sqflite path home_widget share_plus file_picker path_provider shared_preferences image_picker flutter_local_notifications flutter_timezone timezone
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: habit-tracker-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
